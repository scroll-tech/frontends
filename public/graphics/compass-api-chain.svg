<svg xmlns="http://www.w3.org/2000/svg" class="chain" viewBox="0 0 944 96" role="img"
     aria-label="An AI model connecting to a ZK API key, which connects to Compass">
<style>
  /* Glen's chain-horizontal.html, kept verbatim minus its demo page wrapper.
     Lives as a standalone .svg so a plain img tag can render it: CSS animations
     still run there, and it stays one cacheable file to swap when he iterates. */
  .chain {
    --blue:      #2056e5;
    --ink:       #101828;
    --card:      #ffffff;
    --loop:      6s;
    --flow:      .9s;
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .chain .node,
  .chain .pill { transform-box: fill-box; transform-origin: center; }

  .chain .card,
  .chain .pill-box {
    fill: var(--card);
    filter: drop-shadow(0 1px 2px rgba(15, 23, 42, .10))
            drop-shadow(0 6px 14px rgba(15, 23, 42, .12));
  }
  .chain .pill-box { stroke: var(--blue); stroke-width: 1.4; }

  .chain .label {
    fill: var(--ink); font-size: 18px; font-weight: 550;
    letter-spacing: .055em; text-anchor: middle;
  }
  .chain .pill-label {
    fill: var(--blue); font-size: 13.5px; font-weight: 600; letter-spacing: .01em;
  }
  .chain .link-icon {
    fill: none; stroke: var(--blue); stroke-width: 2.4;
    stroke-linecap: round; stroke-linejoin: round;
  }

  .chain .wire      { fill: none; stroke: var(--blue); stroke-width: 3; stroke-linecap: round; }
  .chain .wire-flow { stroke: #fff; stroke-width: 3; opacity: .55;
                      stroke-dasharray: 8 12; animation: march var(--flow) linear infinite; }
  .chain .wire-mask { fill: none; stroke: #fff; stroke-width: 14;
                      stroke-dasharray: 100; stroke-dashoffset: 100; }

  @keyframes pop {
    0%,  2%   { opacity: 0; transform: scale(.62); }
    6%        { opacity: 1; }
    9%        { transform: scale(1.045); }
    12%, 74%  { opacity: 1; transform: scale(1); }
    80%       { opacity: 0; transform: scale(.7); }
    100%      { opacity: 0; transform: scale(.62); }
  }
  @keyframes draw {
    0%,  3%   { stroke-dashoffset: 100; }
    14%, 74%  { stroke-dashoffset: 0; }
    86%, 100% { stroke-dashoffset: -100; }
  }
  @keyframes march { to { stroke-dashoffset: -20; } }

  /* choreography: left to right */
  .chain .node--model  { animation: pop var(--loop) linear infinite  .10s backwards; }
  .chain .pill--one    { animation: pop var(--loop) linear infinite  .85s backwards; }
  .chain .node--key    { animation: pop var(--loop) linear infinite 1.20s backwards; }
  .chain .pill--two    { animation: pop var(--loop) linear infinite 1.95s backwards; }
  .chain .node--compass{ animation: pop var(--loop) linear infinite 2.30s backwards; }

  .chain .mask--one    { animation: draw var(--loop) ease-in-out infinite  .45s backwards; }
  .chain .mask--two    { animation: draw var(--loop) ease-in-out infinite 1.55s backwards; }

  @media (prefers-reduced-motion: reduce) {
    .chain .node, .chain .pill, .chain .wire-flow { animation: none; opacity: 1; }
    .chain .wire-mask { animation: none; stroke-dashoffset: 0; }
  }
</style>

  <defs>
    <mask id="h-reveal-1" maskUnits="userSpaceOnUse">
      <path class="wire-mask mask--one" pathLength="100" d="M184 48 L384 48"/>
    </mask>
    <mask id="h-reveal-2" maskUnits="userSpaceOnUse">
      <path class="wire-mask mask--two" pathLength="100" d="M560 48 L760 48"/>
    </mask>
  </defs>

  <g mask="url(#h-reveal-1)">
    <path class="wire" d="M184 48 L384 48"/>
    <path class="wire wire-flow" d="M184 48 L384 48"/>
  </g>
  <g mask="url(#h-reveal-2)">
    <path class="wire" d="M560 48 L760 48"/>
    <path class="wire wire-flow" d="M560 48 L760 48"/>
  </g>

  <!-- AI MODEL -->
  <g class="node node--model">
    <rect class="card" x="8" y="16" width="176" height="64" rx="18"/>
    <text class="label" x="96" y="54.3">AI MODEL</text>
  </g>

  <!-- Connect -->
  <g class="pill pill--one">
    <rect class="pill-box" x="226" y="29" width="116" height="38" rx="19"/>
    <g class="link-icon" transform="translate(244 39.5) scale(0.708)">
      <path d="M9 17H7A5 5 0 0 1 7 7h2"/>
      <path d="M15 7h2a5 5 0 1 1 0 10h-2"/>
      <path d="M8 12h8"/>
    </g>
    <text class="pill-label" x="268" y="52.8">Connect</text>
  </g>

  <!-- ZK API KEY -->
  <g class="node node--key">
    <rect class="card" x="384" y="16" width="176" height="64" rx="18"/>
    <text class="label" x="472" y="54.3">ZK API KEY</text>
  </g>

  <!-- Connect -->
  <g class="pill pill--two">
    <rect class="pill-box" x="602" y="29" width="116" height="38" rx="19"/>
    <g class="link-icon" transform="translate(620 39.5) scale(0.708)">
      <path d="M9 17H7A5 5 0 0 1 7 7h2"/>
      <path d="M15 7h2a5 5 0 1 1 0 10h-2"/>
      <path d="M8 12h8"/>
    </g>
    <text class="pill-label" x="644" y="52.8">Connect</text>
  </g>

  <!-- COMPASS -->
  <g class="node node--compass">
    <rect class="card" x="760" y="16" width="176" height="64" rx="18"/>
    <text class="label" x="848" y="54.3">COMPASS</text>
  </g>
</svg>
