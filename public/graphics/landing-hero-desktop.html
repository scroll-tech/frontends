<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scroll Gateway — model routing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --text:#101820;
    --dim:#6C7683;
    --line:rgba(22,30,42,.28);
    --edge:rgba(16,24,36,.10);
    --shadow:0 1px 2px rgba(16,24,40,.07), 0 10px 26px rgba(16,24,40,.13);
    --violet:#6D45E8;
    --mark:#39424E;
    --mint:#0FB07C;
    --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:transparent;                /* no background — composite over anything */
    display:grid;place-items:center;
    font-family:var(--mono);
    -webkit-font-smoothing:antialiased;
  }
  body[data-bg="white"]{background:#FFFFFF}
  body[data-bg="black"]{background:#06080B}
  body[data-bg="green"]{background:#00B140}

  #wrap{position:relative;width:100%;height:100%;overflow:hidden}
  #stage{
    position:absolute;left:50%;top:50%;width:1200px;height:460px;
    transform-origin:center center;
    will-change:transform;
  }

  /* ---------- wires ---------- */
  svg#wires{position:absolute;inset:0;width:1200px;height:460px;overflow:visible}
  .wire{fill:none;stroke:var(--line);stroke-width:1.1;stroke-linecap:round}
  .wire.out{stroke:rgba(15,176,124,.42)}
  .trail{fill:none;stroke-width:1.9;stroke-linecap:round;opacity:.9}

  /* ---------- nodes ---------- */
  .node{
    position:absolute;display:flex;align-items:center;gap:9px;
    padding:0 12px;height:34px;border-radius:17px;
    background:var(--paper);
    border:1px solid var(--edge);
    box-shadow:var(--shadow);
    color:var(--text);font-size:11.5px;font-weight:500;letter-spacing:.085em;
    opacity:0;transform:translateX(-10px);
    transition:border-color .3s ease, box-shadow .3s ease;
  }
  .node.in{animation:nodeIn .5s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes nodeIn{to{opacity:1;transform:translateX(0)}}
  .node .glyph{width:15px;height:15px;flex:0 0 15px;opacity:.55}
  .node .glyph svg{display:block;width:15px;height:15px}
  .node.live{border-color:rgba(109,69,232,.45);box-shadow:0 0 0 1px rgba(109,69,232,.14), 0 10px 28px rgba(109,69,232,.22)}
  .node.live .glyph{opacity:1;color:var(--violet)}
  .node .tag{margin-left:auto;font-size:8.5px;color:var(--dim);letter-spacing:.12em;opacity:.8}

  /* ---------- hub ---------- */
  #hub{position:absolute;left:600px;top:230px;transform:translate(-50%,-50%);width:340px;height:340px}
  #glow{
    position:absolute;inset:0;border-radius:50%;
    background:
      radial-gradient(38% 38% at 50% 42%, rgba(109,69,232,.20), transparent 72%),
      radial-gradient(46% 46% at 52% 62%, rgba(192,131,18,.15), transparent 74%),
      radial-gradient(58% 58% at 50% 50%, rgba(15,176,124,.12), transparent 76%);
    filter:blur(2px);
    opacity:0;transition:opacity .6s ease;
  }
  #hub.ready #glow{opacity:1;animation:breathe 5.2s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}

  .facet{
    position:absolute;width:98px;height:98px;left:121px;top:121px;border-radius:22px;
    background:var(--paper);border:1px solid var(--edge);
    box-shadow:0 1px 2px rgba(16,24,40,.06), 0 8px 20px rgba(16,24,40,.10);
    transform-origin:center;
    transition:border-color .25s ease, background .25s ease, box-shadow .25s ease;
  }
  .facet[data-p="n"]{transform:translateY(-68px) rotate(45deg)}
  .facet[data-p="e"]{transform:translateX(68px) rotate(45deg)}
  .facet[data-p="s"]{transform:translateY(68px) rotate(45deg)}
  .facet[data-p="w"]{transform:translateX(-68px) rotate(45deg)}
  .facet.hot{border-color:rgba(109,69,232,.5);background:#F7F4FF;box-shadow:0 0 0 3px rgba(109,69,232,.10), 0 8px 20px rgba(109,69,232,.16)}
  .facet[data-p="s"].hot,.facet[data-p="e"].hot{border-color:rgba(15,176,124,.5);background:#F1FBF7;box-shadow:0 0 0 3px rgba(15,176,124,.10), 0 8px 20px rgba(15,176,124,.16)}

  .flabel{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    font-size:8.5px;letter-spacing:.09em;color:var(--dim);white-space:nowrap;
    transition:color .25s ease;
  }
  .flabel.hot{color:var(--text)}
  /* all four sit on the same radius, hugging the core in the wide part of each facet.
     Side labels are turned 90° — horizontal text there would run into the core. */
  .flabel[data-p="n"]{margin-top:-91px}
  .flabel[data-p="s"]{margin-top:91px}
  .flabel[data-p="w"]{margin-left:-91px;transform:translate(-50%,-50%) rotate(90deg)}
  .flabel[data-p="e"]{margin-left:91px;transform:translate(-50%,-50%) rotate(90deg)}

  #core{
    position:absolute;left:50%;top:50%;width:112px;height:112px;margin:-56px 0 0 -56px;
    border-radius:26px;transform:rotate(45deg);
    background:var(--paper);border:1px solid var(--edge);
    box-shadow:0 2px 4px rgba(16,24,40,.07), 0 16px 40px rgba(16,24,40,.16);
  }
  #coreface{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;place-items:center;gap:6px}
  /* ring and key share one box so they stay concentric */
  #ringwrap{position:relative;width:56px;height:56px}
  #ring{position:absolute;inset:0;width:56px;height:56px;animation:spin 14s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  #keymark{position:absolute;inset:0;display:grid;place-items:center;color:var(--mark);transition:color .35s ease}
  #corelabel{font-size:8.5px;letter-spacing:.2em;color:var(--dim);margin-top:2px}
  #hub.hit #keymark{color:var(--mint)}

  .pulse{
    position:absolute;left:50%;top:50%;width:180px;height:180px;margin:-90px 0 0 -90px;
    border-radius:50%;border:1px solid rgba(15,176,124,.55);
    transform:scale(.55);opacity:0;pointer-events:none;
  }
  .pulse.go{animation:ring .95s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes ring{0%{transform:scale(.5);opacity:.85}100%{transform:scale(1.5);opacity:0}}

  #caption{
    position:absolute;left:600px;top:412px;transform:translateX(-50%);
    font-size:10px;letter-spacing:.05em;color:var(--dim);white-space:nowrap;
    opacity:0;transition:opacity .8s ease .6s;
  }
  #stage.on #caption{opacity:1}

  /* ---------- unified panel ---------- */
  #panel{
    position:absolute;left:946px;top:120px;width:218px;height:222px;border-radius:20px;
    background:var(--paper);border:1px solid var(--edge);
    box-shadow:0 2px 4px rgba(16,24,40,.07), 0 18px 44px rgba(16,24,40,.16);
    padding:14px 16px;color:var(--text);
    opacity:0;transform:translateX(12px);
  }
  #panel.in{animation:panelIn .6s cubic-bezier(.2,.8,.2,1) .5s forwards}
  @keyframes panelIn{to{opacity:1;transform:translateX(0)}}
  #panel h1{margin:0;font-size:12.5px;font-weight:700;letter-spacing:.1em}
  #panel .sub{margin-top:4px;font-size:9px;letter-spacing:.14em;color:var(--dim)}
  #ports{position:absolute;left:0;top:0;width:100%;height:100%}
  .port{
    position:absolute;left:16px;display:flex;align-items:center;gap:8px;
    font-size:10.5px;letter-spacing:.1em;color:var(--dim);transform:translateY(-50%);
  }
  .port .dot{width:6px;height:6px;border-radius:50%;background:rgba(22,30,42,.28);transition:background .25s ease, box-shadow .25s ease}
  .port.hot{color:var(--text)}
  .port.hot .dot{background:var(--mint);box-shadow:0 0 0 4px rgba(15,176,124,.16)}
  #meter{position:absolute;left:16px;bottom:13px;font-size:9px;letter-spacing:.1em;color:var(--dim)}
  #meter b{color:var(--mint);font-weight:500}

  /* ---------- controls ---------- */
  #ui{
    position:fixed;right:14px;bottom:12px;display:flex;gap:6px;
    font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;z-index:9;
  }
  #ui button{
    font:inherit;letter-spacing:inherit;color:#5A6472;background:#fff;
    border:1px solid rgba(16,24,36,.14);border-radius:11px;padding:5px 10px;cursor:pointer;
    box-shadow:0 1px 2px rgba(16,24,40,.08);
  }
  #ui button:hover{color:#101820;border-color:rgba(16,24,36,.32)}
  #ui button:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
  body.clean #ui{display:none}

  @media (prefers-reduced-motion: reduce){
    #hub.ready #glow{animation:none}
    #ring{animation:none}
    .pulse.go{animation:none}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <svg id="wires" viewBox="0 0 1200 460" aria-hidden="true">
      <defs>
        <filter id="chipShadow" x="-40%" y="-120%" width="180%" height="340%">
          <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#101820" flood-opacity=".18"/>
        </filter>
      </defs>
      <g id="base"></g>
      <g id="trails"></g>
      <g id="chips" filter="url(#chipShadow)"></g>
    </svg>

    <div id="hub">
      <div id="glow"></div>
      <div class="facet" data-p="w"></div>
      <div class="facet" data-p="n"></div>
      <div class="facet" data-p="s"></div>
      <div class="facet" data-p="e"></div>
      <div id="core"></div>
      <div class="flabel" data-p="w">ENCRYPT</div>
      <div class="flabel" data-p="n">PROVE</div>
      <div class="flabel" data-p="s">VERIFY</div>
      <div class="flabel" data-p="e">ROUTE</div>
      <div id="coreface">
        <div id="ringwrap">
          <svg id="ring" viewBox="0 0 56 56" aria-hidden="true">
            <circle cx="28" cy="28" r="21" fill="none" stroke="rgba(16,24,36,.80)"
                    stroke-width="2.4" stroke-linecap="round" stroke-dasharray="1.6 8.4"/>
          </svg>
          <div id="keymark">
<svg class="mark" viewBox="0 0 100 100" width="24" height="24" fill="currentColor" aria-hidden="true"><path d="M29.79 98.31C25.43 97.12 21.08 93.45 19.17 89.35C18.2 87.29 18.2 87.19 18.08 56.03L17.96 24.78L16.22 24.78L14.47 24.78L14.47 21.93L14.47 19.08L17.59 19.08C20.54 19.08 20.78 19.15 22.19 20.57L23.68 22.06L23.68 52.29C23.68 86.16 23.62 85.37 26.74 88.92C30.42 93.1 36.1 94.18 41.06 91.64C45.61 89.31 48.38 84.12 47.43 79.69C46.73 76.43 46.21 75.37 44.28 73.28C42.33 71.17 39.6 69.96 36.76 69.96L35.09 69.96L35.09 73.25L35.09 76.54L36.84 76.54L38.6 76.54L38.6 79.39L38.6 82.24L35.92 82.24C33.92 82.24 32.93 82.01 31.97 81.33C29.68 79.7 29.3 78.35 29.46 72.51L29.61 67.26L31.25 65.74L32.9 64.23L59.98 64.35L87.06 64.47L89.58 65.66C98.53 69.85 102.47 80.82 98.13 89.45C96.68 92.33 92.82 96.03 89.79 97.43L87.06 98.68L59.43 98.77C38.54 98.83 31.31 98.72 29.79 98.31ZM87.38 91.75C91.88 89.54 94.12 85.53 93.78 80.26C93.5 75.88 90.56 72.18 86.09 70.59C84.81 70.13 80.48 69.99 66.99 69.98L49.55 69.96L50.86 72.26C54.09 77.99 54.26 83.68 51.38 89.35L49.67 92.74L56.74 92.89C60.63 92.97 68.55 93.03 74.34 93.01L84.87 92.98L87.38 91.75ZM89.58 61.42L86.84 60.56L86.84 34.6C86.84 9.7 86.81 8.61 86.0 7.61L85.17 6.58L54.97 6.46C23.14 6.33 20.43 6.46 16.45 8.28C13.16 9.79 9.45 13.41 7.92 16.61C4.52 23.73 5.61 30.69 11.13 37.19C13.91 40.47 14.33 42.2 12.62 43.4C10.89 44.61 9.93 44.22 6.93 41.11C1.09 35.06 -1.09 27.58 0.63 19.46C2.46 10.83 9.87 3.33 18.57 1.32C21.07 0.74 26.03 0.66 54.12 0.76L86.77 0.88L88.67 2.21C89.71 2.95 91.02 4.35 91.56 5.34L92.55 7.13L92.44 34.71L92.32 62.28L89.58 61.42ZM33.77 50.88L33.77 48.03L52.34 48.03C69.78 48.03 70.96 48.08 71.64 48.83C72.71 50.0 72.58 52.22 71.39 53.05C70.55 53.64 67.97 53.73 52.1 53.73L33.77 53.73L33.77 50.88ZM33.77 36.84L33.77 33.99L55.48 33.99C76.61 33.99 77.22 34.01 78.07 34.87C78.55 35.35 78.95 36.24 78.95 36.84C78.95 37.45 78.55 38.33 78.07 38.82C77.22 39.67 76.61 39.69 55.48 39.69L33.77 39.69L33.77 36.84ZM33.86 22.92L33.99 20.18L52.15 20.06C72.51 19.93 72.37 19.91 72.37 22.79C72.37 25.75 73.03 25.66 52.36 25.66L33.73 25.66L33.86 22.92Z"/></svg>
          </div>
        </div>
        <div id="corelabel">ZK PROOF</div>
      </div>
      <div class="pulse"></div>
    </div>

    <div id="panel">
      <h1>ONE INTERFACE</h1>
      <div class="sub">ONE KEY &middot; EVERY MODEL</div>
      <div id="ports"></div>
      <div id="meter">VERIFIED CALLS <b id="count">0</b></div>
    </div>

    <div id="caption">no prompts stored &middot; no keys exposed &middot; provider blind</div>
  </div>
</div>

<div id="ui">
  <button id="bgBtn" type="button">BG</button>
  <button id="replayBtn" type="button">REPLAY</button>
</div>

<script>
(() => {
  const S = { W:1200, H:460 };
  const NS = "http://www.w3.org/2000/svg";
  const el = (t,a={}) => { const n=document.createElementNS(NS,t); for(const k in a) n.setAttribute(k,a[k]); return n; };
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* --- glyphs: abstract marks, one per row --- */
  const G = {
    any:  '<circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="2 2.4"/>',
    hex:  '<path d="M8 1.6l5.5 3.2v6.4L8 14.4 2.5 11.2V4.8z" fill="none" stroke="currentColor" stroke-width="1.4"/>',
    tri:  '<path d="M8 2.2l6 11.6H2z" fill="none" stroke="currentColor" stroke-width="1.4"/>',
    sq:   '<rect x="3" y="3" width="10" height="10" rx="2.4" fill="none" stroke="currentColor" stroke-width="1.4"/>',
    star: '<path d="M8 2v12M2.8 5l10.4 6M13.2 5L2.8 11" stroke="currentColor" stroke-width="1.4" fill="none"/>',
    wave: '<path d="M2 10c2-5 4-5 6 0s4 5 6 0" fill="none" stroke="currentColor" stroke-width="1.4"/>',
    dot:  '<circle cx="8" cy="8" r="5.4" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="8" r="1.7" fill="currentColor"/>',
    grid: '<path d="M3 6.2h10M3 9.8h10M6.2 3v10M9.8 3v10" stroke="currentColor" stroke-width="1.3" fill="none"/>',
    bolt: '<path d="M9.4 2L4 9h3.4L6.6 14 12 7H8.6z" fill="none" stroke="currentColor" stroke-width="1.3"/>'
  };

  const MODELS = [
    { name:"ANY MODEL",   g:"any",  tag:"BYOM" },
    { name:"SONNET 5",    g:"hex",  tag:"" },
    { name:"KIMI K2",     g:"wave", tag:"" },
    { name:"GPT-5",       g:"dot",  tag:"" },
    { name:"GEMINI 3",    g:"tri",  tag:"" },
    { name:"LLAMA 4",     g:"sq",   tag:"OSS" },
    { name:"DEEPSEEK V3", g:"star", tag:"OSS" },
    { name:"QWEN 3",      g:"grid", tag:"OSS" },
    { name:"GROK 4",      g:"bolt", tag:"" }
  ];

  const CARD_W=214, CARD_H=34, GAP=13;
  const LEFT_X=36, LEFT_X2=LEFT_X+CARD_W;
  const TOP=(S.H-(MODELS.length*CARD_H+(MODELS.length-1)*GAP))/2;
  const HUB_W=496, HUB_E=704, CY=230;
  const PANEL_X=946;
  const PORTS=[{y:186,label:"CHAT"},{y:230,label:"AGENTS"},{y:274,label:"SDK / API"}];

  const stage=document.getElementById("stage");
  const base=document.getElementById("base");
  const trails=document.getElementById("trails");
  const chips=document.getElementById("chips");
  const hub=document.getElementById("hub");
  const panel=document.getElementById("panel");
  const portsWrap=document.getElementById("ports");
  const countEl=document.getElementById("count");
  const facets=[...document.querySelectorAll(".facet")];
  const flabels=[...document.querySelectorAll(".flabel")];
  const pulse=document.querySelector(".pulse");

  /* --- scale stage to viewport --- */
  const fit=()=>{
    const s=Math.min(innerWidth/(S.W+48), innerHeight/(S.H+48), 1.6);
    stage.style.transform=`translate(-50%,-50%) scale(${s})`;
  };
  addEventListener("resize",fit); fit();

  /* --- build left nodes --- */
  const nodes=MODELS.map((m,i)=>{
    const y=TOP+i*(CARD_H+GAP);
    const d=document.createElement("div");
    d.className="node";
    d.style.left=LEFT_X+"px"; d.style.top=y+"px"; d.style.width=CARD_W+"px";
    d.innerHTML=`<span class="glyph"><svg viewBox="0 0 16 16">${G[m.g]}</svg></span>${m.name}`+
                (m.tag?`<span class="tag">${m.tag}</span>`:"");
    stage.appendChild(d);
    return { node:d, cy:y+CARD_H/2 };
  });

  /* --- build panel ports --- */
  PORTS.forEach(p=>{
    const d=document.createElement("div");
    d.className="port";
    d.style.top=(p.y-120)+"px";
    d.innerHTML=`<span class="dot"></span>${p.label}`;
    portsWrap.appendChild(d);
    p.el=d;
  });

  /* --- paths --- */
  const sPath=(x0,y0,x1,y1,lead,tail)=>{
    const a=x0+lead, b=x1-tail, m=a+(b-a)*0.5;
    return `M ${x0} ${y0} L ${a} ${y0} C ${m} ${y0}, ${m} ${y1}, ${b} ${y1} L ${x1} ${y1}`;
  };

  const inPaths=nodes.map((n,i)=>{
    const ey=CY+(i-(MODELS.length-1)/2)*5;
    const p=el("path",{class:"wire",d:sPath(LEFT_X2,n.cy,HUB_W,ey,28,26)});
    base.appendChild(p); return p;
  });
  const outPaths=PORTS.map(p=>{
    const q=el("path",{class:"wire out",d:sPath(HUB_E,CY,PANEL_X,p.y,30,26)});
    base.appendChild(q); return q;
  });

  /* --- intro: draw wires --- */
  const drawIn=()=>{
    [...inPaths,...outPaths].forEach((p,i)=>{
      const L=p.getTotalLength();
      p.style.strokeDasharray=L; p.style.strokeDashoffset=L;
      p.style.transition="none";
      requestAnimationFrame(()=>{
        p.style.transition=`stroke-dashoffset ${reduce?0:.9}s cubic-bezier(.3,.8,.2,1) ${reduce?0:i*.045}s`;
        p.style.strokeDashoffset=0;
      });
    });
    nodes.forEach((n,i)=>{
      n.node.classList.remove("in");
      n.node.style.animationDelay=(reduce?0:i*.055)+"s";
      requestAnimationFrame(()=>n.node.classList.add("in"));
    });
    panel.classList.remove("in"); requestAnimationFrame(()=>panel.classList.add("in"));
    stage.classList.add("on");
    setTimeout(()=>hub.classList.add("ready"), reduce?0:250);
  };

  /* --- packets --- */
  const IN_LABELS=["PROMPT","TOKENS","REQUEST","CONTEXT","STREAM"];
  const chip=(label,color)=>{
    const w=26+label.length*6.3, g=el("g",{opacity:"0"});
    g.appendChild(el("rect",{x:-w/2,y:-11,width:w,height:22,rx:11,
      fill:"#ffffff",stroke:color,"stroke-opacity":".45","stroke-width":"1"}));
    g.appendChild(el("circle",{cx:-w/2+11,cy:0,r:2.6,fill:color}));
    const t=el("text",{x:-w/2+19,y:3.6,"font-family":"var(--mono)","font-size":"9",
      "letter-spacing":"1.1",fill:"#101820"});
    t.textContent=label; g.appendChild(t);
    chips.appendChild(g); return g;
  };

  const flight=(path,label,color,dur,onDone)=>{
    const L=path.getTotalLength();
    const c=chip(label,color);
    const tr=el("path",{class:"trail",d:path.getAttribute("d"),stroke:color});
    trails.appendChild(tr);
    const T=Math.min(150,L*.34);
    tr.style.strokeDasharray=`${T} ${L+T}`;
    const t0=performance.now();
    const step=now=>{
      const k=Math.min(1,(now-t0)/dur);
      const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
      const d=e*L, pt=path.getPointAtLength(d);
      c.setAttribute("transform",`translate(${pt.x} ${pt.y})`);
      c.setAttribute("opacity", k<.08 ? String(k/.08) : (k>.9 ? String((1-k)/.1) : "1"));
      tr.style.strokeDashoffset=T-d;
      tr.style.opacity=String(.85*(1-Math.max(0,(k-.75)/.25)));
      if(k<1) requestAnimationFrame(step);
      else { c.remove(); tr.remove(); onDone&&onDone(); }
    };
    requestAnimationFrame(step);
  };

  const hotFacet=(p,ms)=>{
    const f=facets.find(x=>x.dataset.p===p), l=flabels.find(x=>x.dataset.p===p);
    f.classList.add("hot"); l.classList.add("hot");
    setTimeout(()=>{f.classList.remove("hot");l.classList.remove("hot");},ms);
  };

  let routed=0, busy=new Set();
  const bump=()=>{ routed++; countEl.textContent=routed.toLocaleString(); };

  const cycle=i=>{
    if(busy.has(i)) return;
    busy.add(i);
    const n=nodes[i];
    n.node.classList.add("live");
    flight(inPaths[i], IN_LABELS[Math.floor(Math.random()*IN_LABELS.length)], "#6D45E8", 1650, ()=>{
      n.node.classList.remove("live"); busy.delete(i);
      hotFacet("w",420); hub.classList.add("hit");
      setTimeout(()=>hotFacet("n",420),150);
      setTimeout(()=>{
        hotFacet("s",420);
        pulse.classList.remove("go"); void pulse.offsetWidth; if(!reduce) pulse.classList.add("go");
      },330);
      setTimeout(()=>{
        hub.classList.remove("hit"); hotFacet("e",420);
        const k=Math.floor(Math.random()*PORTS.length), p=PORTS[k];
        flight(outPaths[k], Math.random()<.4?"PROOF":"VERIFIED", "#0FB07C", 1150, ()=>{
          p.el.classList.add("hot"); bump();
          setTimeout(()=>p.el.classList.remove("hot"),700);
        });
      },520);
    });
  };

  let timer=null;
  const run=()=>{
    clearInterval(timer);
    if(reduce){ cycle(1); cycle(5); return; }
    let order=[...nodes.keys()].sort(()=>Math.random()-.5), k=0;
    timer=setInterval(()=>{
      if(k>=order.length){ order=[...nodes.keys()].sort(()=>Math.random()-.5); k=0; }
      cycle(order[k++]);
    }, 620);
    setTimeout(()=>cycle(3),120);
  };

  drawIn(); setTimeout(run, reduce?0:900);

  /* --- controls --- */
  const BGS=["","white","black","green"]; let bi=0;
  /* embedded on a page (iframe) or ?clean → no controls, nothing but the graphic */
  if(window.self!==window.top || new URLSearchParams(location.search).has("clean"))
    document.body.classList.add("clean");
  const bgBtn=document.getElementById("bgBtn");
  bgBtn.addEventListener("click",()=>{
    bi=(bi+1)%BGS.length;
    if(BGS[bi]) document.body.dataset.bg=BGS[bi]; else delete document.body.dataset.bg;
  });
  document.getElementById("replayBtn").addEventListener("click",()=>{
    routed=0; countEl.textContent="0"; busy.clear();
    chips.textContent=""; trails.textContent="";
    hub.classList.remove("ready"); stage.classList.remove("on");
    drawIn(); setTimeout(run,900);
  });
  addEventListener("keydown",e=>{
    const k=e.key.toLowerCase();
    if(k==="h") document.body.classList.toggle("clean");
    if(k==="b") bgBtn.click();
    if(k==="r") document.getElementById("replayBtn").click();
  });
})();
</script>
</body>
</html>
